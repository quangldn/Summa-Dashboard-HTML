<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSS Feature Map — SUMMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="assets/nav-bar.css" />
  <link rel="stylesheet" href="assets/cmdk.css" />
  <script src="assets/nav.js" defer></script>
  <script src="assets/cmdk.js" defer></script>

  <style>
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }
  html { overflow-x: clip; }
  [hidden] { display: none !important; }

  .head { padding: 26px 0 14px; }
  .head p { margin: 8px 0 0; color: var(--ink-2); font-size: 13.5px;
            line-height: 1.55; max-width: 68ch; }
  .head .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

  /* ------------------------------------------------------ sticky bar */
  .bar { display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap;
         padding: 12px 0 14px; border-bottom: 1px solid var(--line);
         position: sticky; top: 0; z-index: 30; background: var(--bg); }
  .tabs { display: flex; gap: 3px; }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
    background: transparent; border: 0; border-radius: var(--r-sm);
    padding: 7px 13px; cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .tabs button:hover { background: var(--surface-2); color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

  .find { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .find input { width: min(300px, 52vw); }
  .find .n { font-size: 11.5px; color: var(--ink-3); white-space: nowrap;
             font-variant-numeric: tabular-nums; }

  /* --------------------------------------------------------- filters */
  .topics { display: flex; flex-wrap: wrap; gap: 5px; margin: 16px 0 4px; }
  .topics button {
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid transparent;
    border-radius: var(--r-pill); padding: 4px 11px; cursor: pointer;
  }
  .topics button:hover { background: var(--surface-3); color: var(--ink); }
  .topics button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--ink-on-accent);
  }
  .topics button .c { opacity: .65; margin-left: 5px;
                      font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- panels */
  .panel { background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--r-lg); padding: 16px 18px 18px; margin-top: 16px; }
  .panel > header { margin-bottom: 10px; }
  .panel > header h2 { font-size: 16px; display: flex; align-items: baseline;
                       gap: 9px; flex-wrap: wrap; }
  .panel > header .num { font-size: 11px; font-weight: 700; color: var(--ink-on-accent);
                         background: var(--accent); border-radius: var(--r-sm);
                         padding: 1px 7px; }
  .panel > header p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2);
                      line-height: 1.55; max-width: 80ch; }

  /* section rows — the wiki body */
  .secs { display: grid; gap: 1px; background: var(--line);
          border: 1px solid var(--line); border-radius: var(--r);
          overflow: hidden; margin-top: 12px; }
  .sec { background: var(--surface); padding: 8px 12px; display: flex;
         gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .sec:hover { background: var(--surface-2); }
  .sec .id { font-size: 11.5px; font-weight: 650; color: var(--ink-3);
             min-width: 38px; font-variant-numeric: tabular-nums; }
  .sec .t { font-size: 13px; color: var(--ink); flex: 1 1 320px; }
  .sec .t mark { background: var(--accent-soft); color: var(--accent);
                 border-radius: 3px; padding: 0 2px; }
  .sec .pg { font-size: 11.5px; color: var(--ink-3);
             font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* --------------------------------------------------- what's new */
  .news { display: grid; gap: 12px; margin-top: 12px;
          grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .item { background: var(--surface-2); border: 1px solid var(--line);
          border-radius: var(--r); padding: 12px 14px 13px; }
  .item h3 { font-size: 13.5px; line-height: 1.35; }
  .item p { margin: 7px 0 0; font-size: 12px; line-height: 1.55;
            color: var(--ink-2); }
  .item ul { margin: 8px 0 0; padding-left: 16px; display: flex;
             flex-direction: column; gap: 3px; }
  .item li { font-size: 11.5px; line-height: 1.5; color: var(--ink-2); }
  .item .more { font-size: 11px; color: var(--ink-3); margin-top: 5px; }

  /* --------------------------------------------------------- docs */
  .docs { display: grid; gap: 1px; background: var(--line);
          border: 1px solid var(--line); border-radius: var(--r);
          overflow: hidden; margin-top: 12px; }
  .doc { background: var(--surface); padding: 11px 13px; display: grid;
         gap: 3px 14px; grid-template-columns: 54px 1fr auto; align-items: baseline; }
  .doc.out { opacity: .72; }
  .doc .code { font-size: 12px; font-weight: 700; }
  .doc .name { font-size: 13px; color: var(--ink); }
  .doc .pp { font-size: 11.5px; color: var(--ink-3); text-align: right;
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .doc .use { grid-column: 2 / -1; font-size: 11.5px; color: var(--ink-2);
              line-height: 1.5; }
  .doc .shelf { grid-column: 2 / -1; font-size: 11px; color: var(--ink-3); }
  @media (max-width: 560px) {
    .doc { grid-template-columns: 46px 1fr; }
    .doc .pp { grid-column: 2; text-align: left; }
  }

  .note { margin: 12px 0 0; font-size: 12px; line-height: 1.6;
          color: var(--ink-2); max-width: 82ch; }
  .note b { color: var(--ink); font-weight: 600; }
  .flag { margin-top: 12px; background: var(--warn-soft); color: var(--warn-ink);
          border-radius: var(--r-sm); padding: 10px 12px; font-size: 12px;
          line-height: 1.55; }
  .flag b { font-weight: 650; }
  .empty { padding: 34px 8px; text-align: center; color: var(--ink-3);
           font-size: 13px; }
  .foot { border-top: 1px solid var(--line); margin-top: 40px; padding: 18px 0 0;
          color: var(--ink-3); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>

  <header id="summa-nav"></header>

  <main class="wrap">
    <section class="head">
      <h1>PSS Feature Map</h1>
      <p>Release 26.6, from the 24-manual document set. What the platform can
         do, what changed this release, and — the part that saves the most
         time — which of the 38,766 pages to open. Provisioning, CLI and TL1
         are catalogued but deliberately not indexed here.</p>
      <div class="meta" id="meta"></div>
    </section>

    <div class="bar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="find">
        <input type="search" id="q" placeholder="Search features, cards, sections…"
               autocomplete="off" spellcheck="false" aria-label="Search" />
        <span class="n" id="count"></span>
      </div>
    </div>

    <section id="view"></section>
    <footer class="foot" id="foot"></footer>
  </main>

<script>
(function () {
  'use strict';

  var DATA = null;
  var state = { tab: 'map', topic: 'all', q: '' };
  var TABS = [
    { id: 'map',  label: 'Feature map' },
    { id: 'new',  label: 'New in 26.6' },
    { id: 'docs', label: 'Where to look' },
  ];

  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, '');
      else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }

  function pill(cls, text) { return el('span', { class: 'pill ' + cls, text: text }); }

  /* Highlight the query inside a title without ever putting the query into
     innerHTML — section titles and the query are both data. */
  function marked(text, q) {
    var node = el('span');
    if (!q) { node.textContent = text; return node; }
    var low = text.toLowerCase(), ql = q.toLowerCase(), i = 0;
    while (true) {
      var hit = low.indexOf(ql, i);
      if (hit < 0) { node.appendChild(document.createTextNode(text.slice(i))); break; }
      node.appendChild(document.createTextNode(text.slice(i, hit)));
      node.appendChild(el('mark', { text: text.slice(hit, hit + q.length) }));
      i = hit + q.length;
    }
    return node;
  }

  function hit(q, parts) {
    if (!q) return true;
    return parts.filter(Boolean).join(' ').toLowerCase().indexOf(q.toLowerCase()) >= 0;
  }

  // ============================================================ feature map
  function viewMap() {
    var out = el('div');
    var q = state.q;

    // topic filter, counted on what the search leaves behind
    var counts = {}, total = 0;
    DATA.chapters.forEach(function (ch) {
      ch.sections.forEach(function (s) {
        if (!hit(q, [s.title, s.sec, s.topic, ch.name])) return;
        counts[s.topic] = (counts[s.topic] || 0) + 1;
        total++;
      });
    });

    var bar = el('div', { class: 'topics' });
    bar.appendChild(el('button', {
      type: 'button', 'aria-pressed': state.topic === 'all' ? 'true' : 'false',
      onclick: function () { state.topic = 'all'; render(); },
    }, [document.createTextNode('All'),
        el('span', { class: 'c', text: String(total) })]));
    Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    }).forEach(function (t) {
      bar.appendChild(el('button', {
        type: 'button', 'aria-pressed': state.topic === t ? 'true' : 'false',
        onclick: function () { state.topic = state.topic === t ? 'all' : t; render(); },
      }, [document.createTextNode(t),
          el('span', { class: 'c', text: String(counts[t]) })]));
    });
    out.appendChild(bar);

    var shown = 0;
    DATA.chapters.forEach(function (ch) {
      var secs = ch.sections.filter(function (s) {
        if (state.topic !== 'all' && s.topic !== state.topic) return false;
        return hit(q, [s.title, s.sec, s.topic, ch.name]);
      });
      if (!secs.length) return;
      shown += secs.length;

      var p = el('section', { class: 'panel' }, [
        el('header', {}, [
          el('h2', {}, [
            el('span', { class: 'num', text: ch.num }),
            el('span', { text: ch.name }),
            pill('mute', secs.length + ' of ' + ch.count),
          ]),
          el('p', { text: ch.blurb }),
        ]),
      ]);
      var list = el('div', { class: 'secs' });
      secs.forEach(function (s) {
        list.appendChild(el('div', { class: 'sec' }, [
          el('span', { class: 'id', text: s.sec }),
          el('span', { class: 't' }, [marked(s.title, q)]),
          s.topic !== 'General' ? pill('mute', s.topic) : null,
          el('span', { class: 'pg', text: 'p. ' + s.page }),
        ]));
      });
      p.appendChild(list);
      out.appendChild(p);
    });

    if (!shown) {
      out.appendChild(el('div', { class: 'empty',
        text: 'Nothing in the feature index matches that.' }));
    }
    $('count').textContent = shown + ' section' + (shown === 1 ? '' : 's');
    return out;
  }

  // ============================================================ what's new
  var KIND_ORDER = ['hardware', 'pluggables', 'control plane', 'software', 'other'];

  function viewNew() {
    var out = el('div'), q = state.q, shown = 0;

    DATA.whatsNew.slice().sort(function (a, b) {
      return KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind);
    }).forEach(function (g) {
      var items = g.items.filter(function (it) {
        return hit(q, [it.name, it.detail].concat(it.bullets));
      });
      if (!items.length) return;
      shown += items.length;

      var p = el('section', { class: 'panel' }, [
        el('header', {}, [
          el('h2', {}, [
            el('span', { text: g.title }),
            pill(g.kind === 'hardware' ? 'ok' : 'mute',
                 items.length + (items.length === 1 ? ' item' : ' items')),
          ]),
        ]),
      ]);

      var grid = el('div', { class: 'news' });
      items.forEach(function (it) {
        var card = el('article', { class: 'item' }, [
          el('h3', {}, [marked(it.name, q)]),
        ]);
        if (it.detail) card.appendChild(el('p', { text: it.detail }));
        if (it.bullets.length) {
          var ul = el('ul');
          it.bullets.slice(0, 8).forEach(function (b) {
            ul.appendChild(el('li', { text: b }));
          });
          card.appendChild(ul);
          if (it.bullets.length > 8) {
            card.appendChild(el('div', { class: 'more',
              text: '+' + (it.bullets.length - 8) + ' more lines in the guide' }));
          }
        }
        grid.appendChild(card);
      });
      p.appendChild(grid);

      if (g.kind === 'hardware' && !q) {
        p.appendChild(el('div', { class: 'flag' }, [
          el('b', { text: 'Source inconsistency worth knowing. ' }),
          document.createTextNode(
            'The guide’s prose calls the PSS-4hc a 15RU shelf, while its own ' +
            'spec bullets say 6RU (264.7 mm). 264.7 mm is 6RU, and 15RU / ' +
            '664.7 mm is the PSS-10hc — so the prose looks like a copy-paste ' +
            'from the paragraph below it. Quote 6RU.'),
        ]));
      }
      out.appendChild(p);
    });

    if (!shown) {
      out.appendChild(el('div', { class: 'empty',
        text: 'Nothing in the 26.6 delta matches that.' }));
    }
    $('count').textContent = shown + ' item' + (shown === 1 ? '' : 's');
    return out;
  }

  // ============================================================ documents
  var KIND_LABEL = {
    features: 'Features', hardware: 'Hardware', reference: 'Reference',
    install: 'Installation', provisioning: 'Provisioning',
    operations: 'Operations', safety: 'Safety',
  };

  function viewDocs() {
    var out = el('div'), q = state.q, shown = 0;
    var inScope = ['features', 'hardware', 'reference'];

    [['In scope — features and hardware', true],
     ['Catalogued, deliberately not read', false]].forEach(function (grp) {
      var docs = DATA.documents.filter(function (d) {
        var keep = inScope.indexOf(d.kind) >= 0;
        if (keep !== grp[1]) return false;
        return hit(q, [d.code, d.title, d.use, d.appliesTo, KIND_LABEL[d.kind]]);
      });
      if (!docs.length) return;
      shown += docs.length;

      var p = el('section', { class: 'panel' }, [
        el('header', {}, [el('h2', {}, [
          el('span', { text: grp[0] }),
          pill('mute', docs.length + ' of 24'),
        ])]),
      ]);
      var list = el('div', { class: 'docs' });
      docs.forEach(function (d) {
        list.appendChild(el('div', { class: 'doc' + (grp[1] ? '' : ' out') }, [
          el('span', { class: 'code' }, [marked(d.code, q)]),
          el('span', { class: 'name' }, [marked(d.title, q)]),
          el('span', { class: 'pp', text: d.pages.toLocaleString() + ' pp' +
                       (d.issue > 1 ? ' · Iss ' + d.issue : '') }),
          el('span', { class: 'use', text: d.use }),
          d.appliesTo ? el('span', { class: 'shelf', text: d.appliesTo }) : null,
        ]));
      });
      p.appendChild(list);
      if (grp[1] && !q) {
        p.appendChild(el('p', { class: 'note' }, [
          el('b', { text: 'HQ and TQ are one guide in two volumes. ' }),
          document.createTextNode(
            'HQ is the hardware volume — shelves, cards, slots, weight, power. ' +
            'TQ is the feature volume, and it is what this page indexes. ' +
            '“What is it” goes to HQ; “what can it do” goes to TQ. Neither ' +
            'title says so.'),
        ]));
        p.appendChild(el('p', { class: 'note' }, [
          el('b', { text: 'Reading a CDoc number. ' }),
          document.createTextNode(
            '3KC-71311-TAAA-TQZZA — 71311 is PSS product documentation ' +
            '(70118 is NETCONF/gRPC), TAAA is fixed, and the two letters ' +
            'before ZZA are the manual. Only HQ and TQ are at Issue 2.'),
        ]));
      }
      out.appendChild(p);
    });

    if (!shown) {
      out.appendChild(el('div', { class: 'empty', text: 'No document matches that.' }));
    }
    $('count').textContent = shown + ' document' + (shown === 1 ? '' : 's');
    return out;
  }

  // ================================================================= shell
  function render() {
    var host = $('view');
    host.textContent = '';
    host.appendChild(state.tab === 'map' ? viewMap()
                   : state.tab === 'new' ? viewNew() : viewDocs());

    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === state.tab ? 'true' : 'false');
    });

    var p = [state.tab];
    if (state.topic !== 'all') p.push('topic=' + encodeURIComponent(state.topic));
    if (state.q) p.push('q=' + encodeURIComponent(state.q));
    var h = '#' + p.join('&');
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  function fromHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    h.split('&').forEach(function (part, i) {
      if (i === 0 && TABS.some(function (t) { return t.id === part; })) state.tab = part;
      else if (part.indexOf('topic=') === 0) state.topic = decodeURIComponent(part.slice(6));
      else if (part.indexOf('q=') === 0) state.q = decodeURIComponent(part.slice(2));
    });
  }

  function init() {
    fetch('assets/pss-266.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        DATA = d;

        var tabs = $('tabs');
        TABS.forEach(function (t) {
          var b = el('button', { type: 'button', role: 'tab', text: t.label,
            'aria-selected': 'false',
            onclick: function () { state.tab = t.id; state.topic = 'all'; render(); } });
          b.dataset.tab = t.id;
          tabs.appendChild(b);
        });

        var c = d.meta.counts;
        var m = $('meta');
        m.appendChild(pill('mute', 'Release ' + d.meta.release));
        m.appendChild(pill('mute', c.sections + ' feature sections'));
        m.appendChild(pill('mute', c.newItems + ' new in 26.6'));
        m.appendChild(pill('mute', c.documents + ' manuals · ' +
                                   c.pages.toLocaleString() + ' pages'));

        $('foot').textContent = d.meta.source + '. ' + d.meta.pageNote + ' ' +
          d.meta.scope + ' Rebuild with tools/extract-pss-266.py then ' +
          'tools/build-pss-266-data.py when a new release lands.';

        var q = $('q');
        q.value = state.q;
        var t;
        q.addEventListener('input', function () {
          clearTimeout(t);
          t = setTimeout(function () { state.q = q.value.trim(); render(); }, 110);
        });

        fromHash();
        q.value = state.q;
        render();

        if (window.SUMMA_CMDK) {
          var rows = [];
          d.chapters.forEach(function (ch) {
            ch.sections.forEach(function (s) {
              rows.push({
                label: s.title,
                hint: 'PSS 26.6 · ' + ch.name + ' · p. ' + s.page,
                keywords: s.topic + ' ' + s.sec,
                run: function () {
                  state.tab = 'map'; state.topic = 'all'; state.q = s.title;
                  $('q').value = s.title; render();
                },
              });
            });
          });
          window.SUMMA_CMDK.register('PSS feature', rows);
        }
      })
      .catch(function () {
        $('view').appendChild(el('div', { class: 'empty',
          text: 'Could not load assets/pss-266.json. If you opened this file ' +
                'directly from disk the browser blocks the fetch — serve the ' +
                'folder over http instead.' }));
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
}());
</script>
</body>
</html>
